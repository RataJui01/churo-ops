<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Churo Bites — Edit order</title>
<script src="./support.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Kanit:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;font-family:"Poppins","IBM Plex Sans Thai",ui-sans-serif,system-ui,sans-serif;background:#FFF2EB;color:#2B2118;}
  a{color:#A85419;text-decoration:none;}
  a:hover{color:#8A4515;}
  input, textarea, select{font-family:inherit;}
</style>
</helmet>
<div style="width:390px;min-height:1350px;display:flex;flex-direction:column;background:#FFF2EB;box-sizing:border-box;">

  <div style="background:#FFFFFF;border-bottom:1px solid #F5D3B8;padding:20px;display:flex;align-items:center;gap:12px;box-sizing:border-box;">
    <a href="Orders.dc.html" aria-label="Back to orders" style="display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;color:#2B2118;box-sizing:border-box;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
    </a>
    <div style="display:flex;flex-direction:column;gap:1px;">
      <div style="font-family:'Poppins','Kanit',ui-sans-serif,system-ui,sans-serif;font-weight:600;font-size:18px;color:#2B2118;">Edit order</div>
      <div style="font-size:12px;color:#5C5245;">Order #182</div>
    </div>
  </div>

  <div style="flex:1;padding:20px;display:flex;flex-direction:column;gap:22px;">

    <div style="display:flex;flex-direction:column;gap:8px;">
      <div style="font-size:13px;font-weight:600;color:#5C5245;text-transform:uppercase;letter-spacing:0.04em;">Status</div>
      <div style="display:flex;gap:8px;">
        <span style="flex:1;"><input type="radio" name="status" id="st-pending" checked style="position:absolute;opacity:0;width:1px;height:1px;overflow:hidden;"><label for="st-pending" style="display:flex;align-items:center;justify-content:center;gap:5px;min-height:44px;border-radius:999px;background:#FFE8CD;color:#B45309;font-size:13px;font-weight:600;box-sizing:border-box;cursor:pointer;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#B45309" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"></path><path d="M12 17h.01"></path><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path></svg>
          Pending</label></span>
        <span style="flex:1;"><input type="radio" name="status" id="st-done" style="position:absolute;opacity:0;width:1px;height:1px;overflow:hidden;"><label for="st-done" style="display:flex;align-items:center;justify-content:center;gap:5px;min-height:44px;border-radius:999px;border:1px solid #F5D3B8;color:#5C5245;font-size:13px;font-weight:500;box-sizing:border-box;cursor:pointer;">Done</label></span>
        <span style="flex:1;"><input type="radio" name="status" id="st-delivered" style="position:absolute;opacity:0;width:1px;height:1px;overflow:hidden;"><label for="st-delivered" style="display:flex;align-items:center;justify-content:center;gap:5px;min-height:44px;border-radius:999px;border:1px solid #F5D3B8;color:#5C5245;font-size:13px;font-weight:500;box-sizing:border-box;cursor:pointer;">Delivered</label></span>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px;">
      <div style="font-size:13px;font-weight:600;color:#5C5245;text-transform:uppercase;letter-spacing:0.04em;">Items in this order</div>
      <div style="background:#FFFFFF;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(43,33,24,0.06),0 1px 3px rgba(43,33,24,0.08);box-sizing:border-box;">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px;border-bottom:1px solid #F2E3D5;">
          <div style="font-size:14px;font-weight:500;">1x Original (M)</div>
          <div style="display:flex;align-items:center;gap:10px;">
            <div style="font-size:13px;color:#5C5245;">฿35</div>
            <button aria-label="Remove item" style="width:28px;height:28px;border-radius:50%;border:none;background:#FFDCDC;color:#B91C1C;display:flex;align-items:center;justify-content:center;cursor:pointer;box-sizing:border-box;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
          <div style="display:flex;flex-direction:column;gap:2px;">
            <div style="font-size:14px;font-weight:500;">1x Chocolate dip (M)</div>
            <div style="font-size:12px;color:#5C5245;">+ Strawberry freeze dried</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            <div style="font-size:13px;color:#5C5245;">฿85</div>
            <button aria-label="Remove item" style="width:28px;height:28px;border-radius:50%;border:none;background:#FFDCDC;color:#B91C1C;display:flex;align-items:center;justify-content:center;cursor:pointer;box-sizing:border-box;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>
        </div>
      </div>
      <a href="NewOrder.dc.html" style="display:flex;align-items:center;justify-content:center;gap:8px;background:#FFE8CD;color:#2B2118;border-radius:10px;padding:12px;min-height:44px;font-size:14px;font-weight:600;box-sizing:border-box;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2B2118" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Add another item
      </a>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px;">
      <div style="font-size:13px;font-weight:600;color:#5C5245;text-transform:uppercase;letter-spacing:0.04em;">Delivery</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <span><input type="radio" name="delivery" id="dv-free" checked style="position:absolute;opacity:0;width:1px;height:1px;overflow:hidden;"><label for="dv-free" style="display:flex;align-items:center;justify-content:center;min-height:44px;padding:8px 16px;border-radius:999px;background:{{accent}};color:#FFFFFF;font-size:14px;font-weight:600;box-sizing:border-box;cursor:pointer;">Free</label></span>
        <span><input type="radio" name="delivery" id="dv-5" style="position:absolute;opacity:0;width:1px;height:1px;overflow:hidden;"><label for="dv-5" style="display:flex;align-items:center;justify-content:center;min-height:44px;padding:8px 16px;border-radius:999px;border:1px solid #F5D3B8;color:#2B2118;font-size:14px;font-weight:500;box-sizing:border-box;cursor:pointer;">฿5</label></span>
        <span><input type="radio" name="delivery" id="dv-10" style="position:absolute;opacity:0;width:1px;height:1px;overflow:hidden;"><label for="dv-10" style="display:flex;align-items:center;justify-content:center;min-height:44px;padding:8px 16px;border-radius:999px;border:1px solid #F5D3B8;color:#2B2118;font-size:14px;font-weight:500;box-sizing:border-box;cursor:pointer;">฿10</label></span>
        <span><input type="radio" name="delivery" id="dv-15" style="position:absolute;opacity:0;width:1px;height:1px;overflow:hidden;"><label for="dv-15" style="display:flex;align-items:center;justify-content:center;min-height:44px;padding:8px 16px;border-radius:999px;border:1px solid #F5D3B8;color:#2B2118;font-size:14px;font-weight:500;box-sizing:border-box;cursor:pointer;">฿15</label></span>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:6px;">
      <label for="edit-delivery-time" style="font-size:13px;font-weight:600;color:#5C5245;text-transform:uppercase;letter-spacing:0.04em;">Delivery time</label>
      <input id="edit-delivery-time" type="time" value="15:00" style="min-height:44px;padding:0 14px;border-radius:6px;border:1px solid #F5D3B8;background:#FFFFFF;color:#2B2118;font-size:15px;box-sizing:border-box;">
    </div>

    <div style="display:flex;flex-direction:column;gap:6px;">
      <label for="staff-select" style="font-size:13px;font-weight:600;color:#5C5245;text-transform:uppercase;letter-spacing:0.04em;">Added by</label>
      <select id="staff-select" style="min-height:44px;padding:0 14px;border-radius:6px;border:1px solid #F5D3B8;background:#FFFFFF;color:#2B2118;font-size:15px;box-sizing:border-box;">
        <option>Jui</option>
        <option>Partner</option>
      </select>
    </div>

    <div style="display:flex;flex-direction:column;gap:6px;">
      <label for="cust-name" style="font-size:13px;font-weight:600;color:#5C5245;text-transform:uppercase;letter-spacing:0.04em;">Customer</label>
      <input id="cust-name" type="text" value="Nan" style="min-height:44px;padding:0 14px;border-radius:6px;border:1px solid #F5D3B8;background:#FFFFFF;color:#2B2118;font-size:15px;box-sizing:border-box;">
    </div>

    <div style="display:flex;flex-direction:column;gap:6px;">
      <label for="cust-note" style="font-size:13px;font-weight:600;color:#5C5245;text-transform:uppercase;letter-spacing:0.04em;">Note (optional)</label>
      <textarea id="cust-note" rows="2" placeholder="Delivery address, allergy notes, etc." style="padding:10px 14px;border-radius:6px;border:1px solid #F5D3B8;background:#FFFFFF;color:#2B2118;font-size:15px;box-sizing:border-box;resize:vertical;"></textarea>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid #F5D3B8;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="font-size:16px;font-weight:600;color:#2B2118;">Total</div>
        <div style="font-family:'Poppins',sans-serif;font-weight:600;font-size:20px;color:#2B2118;">฿120</div>
      </div>
      <button style="margin-top:6px;background:{{accent}};color:#FFFFFF;border:none;border-radius:10px;padding:14px;min-height:48px;font-size:16px;font-weight:600;cursor:pointer;box-sizing:border-box;">Save changes</button>
      <button style="background:none;color:#B91C1C;border:1px solid #F3C6C6;border-radius:10px;padding:12px;min-height:44px;font-size:14px;font-weight:600;cursor:pointer;box-sizing:border-box;">Cancel order</button>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#A85419","options":["#A85419","#FFDCDC","#FFE8CD","#FFD6BA"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#A85419' };
  }
}
</script>
</body>
</html>
