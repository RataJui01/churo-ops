<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Churo Bites — Restock</title>
<script src="./support.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Kanit:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;font-family:"Poppins","IBM Plex Sans Thai",ui-sans-serif,system-ui,sans-serif;background:#FFF2EB;color:#2B2118;}
  a{color:#A85419;text-decoration:none;}
  a:hover{color:#8A4515;}
  input, select{font-family:inherit;}
</style>
</helmet>
<div style="width:390px;min-height:700px;display:flex;flex-direction:column;background:#FFF2EB;box-sizing:border-box;">

  <div style="background:#FFFFFF;border-bottom:1px solid #F5D3B8;padding:20px;display:flex;align-items:center;gap:12px;box-sizing:border-box;">
    <a href="Stock.dc.html" aria-label="Back to stock" style="display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;color:#2B2118;box-sizing:border-box;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
    </a>
    <div style="font-family:'Poppins','Kanit',ui-sans-serif,system-ui,sans-serif;font-weight:600;font-size:18px;color:#2B2118;">Restock</div>
  </div>

  <div style="flex:1;padding:20px;display:flex;flex-direction:column;gap:22px;">

    <div style="display:flex;flex-direction:column;gap:6px;">
      <label for="item-name" style="font-size:13px;font-weight:600;color:#5C5245;text-transform:uppercase;letter-spacing:0.04em;">Item name</label>
      <input id="item-name" type="text" list="existing-items" placeholder="e.g. Flour" style="min-height:44px;padding:0 14px;border-radius:6px;border:1px solid #F5D3B8;background:#FFFFFF;color:#2B2118;font-size:15px;box-sizing:border-box;">
      <datalist id="existing-items">
        <option value="Flour"></option>
        <option value="Sugar"></option>
        <option value="Cinnamon sugar"></option>
        <option value="Chocolate dip"></option>
        <option value="Cooking oil"></option>
        <option value="Cups (S)"></option>
        <option value="Cups (M)"></option>
        <option value="Cups (L)"></option>
      </datalist>
      <div style="font-size:12px;color:#5C5245;line-height:16px;">Type an existing item to top it up, or a new name to start tracking it.</div>
    </div>

    <div style="display:flex;gap:10px;">
      <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
        <label for="restock-qty" style="font-size:13px;font-weight:600;color:#5C5245;text-transform:uppercase;letter-spacing:0.04em;">Quantity</label>
        <input id="restock-qty" type="number" inputmode="decimal" placeholder="0" style="min-height:44px;padding:0 14px;border-radius:6px;border:1px solid #F5D3B8;background:#FFFFFF;color:#2B2118;font-size:15px;box-sizing:border-box;">
      </div>
      <div style="width:110px;display:flex;flex-direction:column;gap:6px;">
        <label for="restock-unit" style="font-size:13px;font-weight:600;color:#5C5245;text-transform:uppercase;letter-spacing:0.04em;">Unit</label>
        <select id="restock-unit" style="min-height:44px;padding:0 10px;border-radius:6px;border:1px solid #F5D3B8;background:#FFFFFF;color:#2B2118;font-size:15px;box-sizing:border-box;">
          <option>kg</option>
          <option>L</option>
          <option>pcs</option>
        </select>
      </div>
    </div>

    <button style="margin-top:6px;background:{{accent}};color:#FFFFFF;border:none;border-radius:10px;padding:14px;min-height:48px;font-size:16px;font-weight:600;cursor:pointer;box-sizing:border-box;">Add restock item</button>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#A85419","options":["#A85419","#FFDCDC","#FFE8CD","#FFD6BA"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#A85419' };
  }
}
</script>
</body>
</html>
