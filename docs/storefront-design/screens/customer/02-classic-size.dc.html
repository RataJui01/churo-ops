<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Classic Churros Plain — เลือกไซซ์</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Kanit:wght@500;600;700&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A85419;text-decoration:none}a:hover{color:#8A4515}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; min-height: 1180px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFF2EB; color: #2B2118; font-family: 'Poppins', 'IBM Plex Sans Thai', ui-sans-serif, system-ui, sans-serif;">

  <div style="position: relative; height: 200px; background: #FFD6BA; display: flex; align-items: center; justify-content: center;">
    <span style="font-size: 13px; line-height: 18px; color: #5C5245;">[รูป Classic Churros · Plain]</span>
    <a href="Main.dc.html" aria-label="ปิด กลับไปหน้าเมนู" style="position: absolute; top: 12px; left: 12px; width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; color: #2B2118; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(43,33,24,0.06), 0 1px 3px rgba(43,33,24,0.08);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </a>
  </div>

  <main style="padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 24px;">
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <h1 style="margin: 0; font-family: 'Poppins', 'Kanit', sans-serif; font-size: 24px; line-height: 32px; font-weight: 600;">Classic Churros · Plain</h1>
      <div style="font-size: 16px; line-height: 24px; font-weight: 600; color: #2B2118;">S ฿35 · M ฿55</div>
    </div>

    <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 8px;">
      <legend style="padding: 0; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; font-size: 15px; line-height: 22px; font-weight: 600;">
        ไซซ์
        <span style="padding: 2px 8px; border-radius: 999px; background: #FFE8CD; color: #B45309; font-size: 11px; line-height: 14px; font-weight: 600;">ต้องเลือก</span>
      </legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
        <sc-for list="{{ sizes }}" as="z" hint-placeholder-count="2">
          <button type="button" onClick="{{ z.pick }}" aria-pressed="{{ z.selected }}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 64px; padding: 10px; border-radius: 10px; box-sizing: border-box; cursor: pointer; background: {{ z.bg }}; color: {{ z.fg }}; border: 1px solid {{ z.bd }};">
            <span style="font-family: 'Poppins', 'Kanit', sans-serif; font-size: 18px; line-height: 26px; font-weight: 600;">{{ z.name }}</span>
            <span style="font-size: 13px; line-height: 18px; font-weight: 500;">{{ z.priceText }}</span>
          </button>
        </sc-for>
      </div>
    </fieldset>

    <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 8px;">
      <legend style="padding: 0; margin-bottom: 8px; font-size: 15px; line-height: 22px; font-weight: 600;">ดิปและท็อปปิ้ง</legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
        <sc-for list="{{ serves }}" as="o" hint-placeholder-count="2">
          <button type="button" onClick="{{ o.pick }}" aria-pressed="{{ o.selected }}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 64px; padding: 10px; border-radius: 10px; box-sizing: border-box; cursor: pointer; text-align: center; background: {{ o.bg }}; color: {{ o.fg }}; border: 1px solid {{ o.bd }};">
            <span style="font-size: 15px; line-height: 22px; font-weight: 600;">{{ o.name }}</span>
            <span style="font-size: 12px; line-height: 16px; font-weight: 500;">{{ o.hint }}</span>
          </button>
        </sc-for>
      </div>
      <div style="font-size: 13px; line-height: 18px; color: #5C5245;">ท็อปปิ้งเพิ่มได้ที่หมวด “ท็อปปิ้ง” ในหน้าเมนู</div>
    </fieldset>
  </main>

  <div style="margin-top: auto; padding: 12px 16px 24px; background: #FFFFFF; border-top: 1px solid #F5D3B8; box-shadow: 0 -4px 8px rgba(43,33,24,0.06); display: flex; align-items: center; gap: 12px;">
    <div style="display: flex; align-items: center; gap: 4px; border: 1px solid #F5D3B8; border-radius: 10px; padding: 2px;">
      <button type="button" onClick="{{ dec }}" aria-label="ลดจำนวน" style="width: 44px; height: 44px; border: none; background: transparent; color: #2B2118; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
      <span aria-live="polite" style="min-width: 24px; text-align: center; font-size: 18px; line-height: 26px; font-weight: 600;">{{ qty }}</span>
      <button type="button" onClick="{{ inc }}" aria-label="เพิ่มจำนวน" style="width: 44px; height: 44px; border: none; background: transparent; color: #2B2118; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
    </div>
    <sc-if value="{{ hasSize }}" hint-placeholder-val="{{ false }}">
      <a href="Main.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 16px; border-radius: 10px; background: #A85419; color: #FFFFFF; font-size: 16px; line-height: 24px; font-weight: 600; box-sizing: border-box;">เพิ่มลงตะกร้า · {{ totalText }}</a>
    </sc-if>
    <sc-if value="{{ noSize }}" hint-placeholder-val="{{ true }}">
      <button type="button" disabled style="flex: 1; min-height: 52px; padding: 0 16px; border-radius: 10px; border: 1px solid #F5D3B8; background: #FFF2EB; color: #5C5245; font-size: 16px; line-height: 24px; font-weight: 600; cursor: not-allowed;">เลือกไซซ์ก่อน</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { size: null, serve: 'on', addons: {}, qty: 1 };
  }
  renderVals() {
    var s = this.state;
    var self = this;
    var Z = [
      { id: 'S', name: 'S', price: 35 },
      { id: 'M', name: 'M', price: 55 }
    ];
    var A = [
      { id: 'dip', name: 'Choc dip' },
      { id: 'pops', name: 'Choc pops' },
      { id: 'straw', name: 'Strawberry freeze dried' },
      { id: 'condensed', name: 'นมข้น' }
    ];
    var sizes = Z.map(function (z) {
      var sel = s.size === z.id;
      return {
        id: z.id, name: z.name, selected: sel,
        priceText: '฿' + z.price,
        bg: sel ? '#A85419' : '#FFFFFF',
        fg: sel ? '#FFFFFF' : '#2B2118',
        bd: sel ? '#A85419' : '#F5D3B8',
        pick: function () { self.setState({ size: z.id }); }
      };
    });
    var serves = [
      { id: 'on', name: 'ราดบนชูโรส', hint: 'ทำตามปกติ' },
      { id: 'side', name: 'แยกดิป/ท็อปปิ้ง', hint: 'ใส่ถ้วยแยก' }
    ].map(function (o) {
      var sel = s.serve === o.id;
      return {
        id: o.id, name: o.name, hint: o.hint, selected: sel,
        bg: sel ? '#A85419' : '#FFFFFF',
        fg: sel ? '#FFFFFF' : '#2B2118',
        bd: sel ? '#A85419' : '#F5D3B8',
        pick: function () { self.setState({ serve: o.id }); }
      };
    });
    var addons = A.map(function (a) {
      var sel = !!s.addons[a.id];
      return {
        id: a.id, name: a.name, selected: sel,
        bd: sel ? '#A85419' : '#F5D3B8',
        boxBg: sel ? '#A85419' : '#FFFFFF',
        boxBd: sel ? '#A85419' : '#5C5245',
        toggle: function () {
          var next = Object.assign({}, self.state.addons);
          next[a.id] = !next[a.id];
          self.setState({ addons: next });
        }
      };
    });
    var base = 0;
    Z.forEach(function (z) { if (z.id === s.size) base = z.price; });
    var addonCount = A.filter(function (a) { return !!s.addons[a.id]; }).length;
    var total = (base + addonCount * 10) * s.qty;
    return {
      sizes: sizes,
      serves: serves,
      addons: addons,
      qty: s.qty,
      hasSize: !!s.size,
      noSize: !s.size,
      totalText: '฿' + total,
      inc: function () { self.setState({ qty: Math.min(self.state.qty + 1, 20) }); },
      dec: function () { self.setState({ qty: Math.max(self.state.qty - 1, 1) }); }
    };
  }
}
</script>
</body>
</html>
