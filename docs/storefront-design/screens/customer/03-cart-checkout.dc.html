<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Churo Bites — ตะกร้าและข้อมูลผู้สั่ง</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Kanit:wght@500;600;700&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A85419;text-decoration:none}a:hover{color:#8A4515}
input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; min-height: 1120px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFF2EB; color: #2B2118; font-family: 'Poppins', 'IBM Plex Sans Thai', ui-sans-serif, system-ui, sans-serif;">

  <header style="background: #FFFFFF; border-bottom: 1px solid #F5D3B8; padding: 12px 16px; display: flex; align-items: center; gap: 8px;">
    <a href="Main.dc.html" aria-label="กลับไปหน้าเมนู" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #2B2118;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Poppins', 'Kanit', sans-serif; font-size: 18px; line-height: 26px; font-weight: 600;">ตะกร้าของคุณ</h1>
  </header>

  <main style="padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 24px;">

    <section style="display: flex; flex-direction: column; gap: 8px;">
      <h2 style="margin: 0; font-size: 15px; line-height: 22px; font-weight: 600;">รายการ (3)</h2>
      <div style="background: #FFFFFF; border-radius: 10px; padding: 4px 16px; box-shadow: 0 1px 2px rgba(43,33,24,0.06), 0 1px 3px rgba(43,33,24,0.08);">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #F2E3D5;">
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
            <div style="font-size: 15px; line-height: 22px; font-weight: 600;">1× Churro Hug · Choco Pops</div>
          </div>
          <div style="font-size: 15px; line-height: 22px; font-weight: 500;">฿69</div>
          <button type="button" aria-label="ลบ Churro Hug Choco Pops" style="width: 44px; height: 44px; margin-right: -10px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer;">
            <span style="width: 28px; height: 28px; border-radius: 50%; background: #FFDCDC; color: #B91C1C; display: flex; align-items: center; justify-content: center;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </span>
          </button>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #F2E3D5;">
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
            <div style="font-size: 15px; line-height: 22px; font-weight: 600;">1× Classic · Plain (M)</div>
            <div style="font-size: 13px; line-height: 18px; color: #5C5245;">ราดบนชูโรส</div>
          </div>
          <div style="font-size: 15px; line-height: 22px; font-weight: 500;">฿55</div>
          <button type="button" aria-label="ลบ Classic Plain M" style="width: 44px; height: 44px; margin-right: -10px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer;">
            <span style="width: 28px; height: 28px; border-radius: 50%; background: #FFDCDC; color: #B91C1C; display: flex; align-items: center; justify-content: center;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </span>
          </button>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0;">
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
            <div style="font-size: 15px; line-height: 22px; font-weight: 600;">1× นมข้น</div>
            <div style="font-size: 13px; line-height: 18px; color: #5C5245;">ท็อปปิ้ง</div>
          </div>
          <div style="font-size: 15px; line-height: 22px; font-weight: 500;">฿10</div>
          <button type="button" aria-label="ลบ นมข้น" style="width: 44px; height: 44px; margin-right: -10px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer;">
            <span style="width: 28px; height: 28px; border-radius: 50%; background: #FFDCDC; color: #B91C1C; display: flex; align-items: center; justify-content: center;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </span>
          </button>
        </div>
      </div>
      <a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 14px; line-height: 20px; font-weight: 600; color: #A85419; align-self: flex-start;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        เพิ่มเมนูอื่น
      </a>
    </section>

    <section style="display: flex; flex-direction: column; gap: 16px;">
      <h2 style="margin: 0; font-size: 15px; line-height: 22px; font-weight: 600;">ข้อมูลผู้สั่ง</h2>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="cust-name" style="font-size: 13px; line-height: 18px; font-weight: 600; color: #5C5245;">ชื่อ (ใช้เรียกตอนรับ)</label>
        <input id="cust-name" type="text" autocomplete="given-name" value="มิ้นท์" style="min-height: 48px; padding: 0 14px; border-radius: 6px; border: 1px solid #F5D3B8; background: #FFFFFF; color: #2B2118; font-size: 16px; box-sizing: border-box;">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="cust-phone" style="font-size: 13px; line-height: 18px; font-weight: 600; color: #5C5245;">เบอร์โทร</label>
        <input id="cust-phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="08x-xxx-xxxx" aria-describedby="phone-help" style="min-height: 48px; padding: 0 14px; border-radius: 6px; border: 1px solid #F5D3B8; background: #FFFFFF; color: #2B2118; font-size: 16px; box-sizing: border-box;">
        <div id="phone-help" style="font-size: 12px; line-height: 16px; color: #5C5245;">ใช้ติดต่อเฉพาะกรณีมีปัญหากับออเดอร์</div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px; padding-top: 16px; border-top: 1px solid #F5D3B8;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="font-size: 16px; line-height: 24px; font-weight: 600;">ยอดรวม</div>
        <div style="font-family: 'Poppins', 'Kanit', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600;">฿134</div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 18px; color: #5C5245;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"></path></svg>
        ชำระผ่าน PromptPay เท่านั้น
      </div>
    </section>
  </main>

  <div style="margin-top: auto; padding: 12px 16px 24px; background: #FFFFFF; border-top: 1px solid #F5D3B8; box-shadow: 0 -4px 8px rgba(43,33,24,0.06);">
    <a href="Payment.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 16px; border-radius: 10px; background: #A85419; color: #FFFFFF; font-size: 16px; line-height: 24px; font-weight: 600; box-sizing: border-box;">ยืนยันออเดอร์ · ไปหน้าจ่ายเงิน</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1120}}'>

  renderVals() {
    return {};
  }

</script>
</body>
</html>
