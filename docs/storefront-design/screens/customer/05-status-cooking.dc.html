      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#15803D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="5 12 10 17 19 7"></polyline></svg>
      <div style="font-size: 13px; line-height: 18px; color: #15803D; font-weight: 600;">ยืนยันการจ่าย ฿134 แล้ว · 18:42</div>
    </div>

    <section style="background: #FFFFFF; border-radius: 10px; padding: 4px 16px; box-shadow: 0 1px 2px rgba(43,33,24,0.06), 0 1px 3px rgba(43,33,24,0.08);">
      <div style="display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid #F2E3D5;">
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <div style="font-size: 14px; line-height: 20px; font-weight: 600;">1× Churro Hug · Choco Pops</div>
        </div>
        <div style="font-size: 14px; line-height: 20px;">฿69</div>
      </div>
      <div style="display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid #F2E3D5;">

      </div>
      <div style="display: flex; justify-content: space-between; gap: 12px; padding: 12px 0;">
        <div style="font-size: 14px; line-height: 20px; font-weight: 600;">รวม</div>
        <div style="font-size: 14px; line-height: 20px; font-weight: 600;">฿134</div>
